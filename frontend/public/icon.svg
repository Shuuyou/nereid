<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#12202e"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- 海面透光 -->
  <ellipse cx="32" cy="8" rx="22" ry="5" fill="#3ec8e8" opacity="0.10"/>
  <!-- 针：深海中那根发光的针 -->
  <g filter="url(#glow)">
    <line x1="32" y1="16" x2="32" y2="44" stroke="#3ec8e8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="32" cy="46" r="3.2" fill="none" stroke="#3ec8e8" stroke-width="2.2"/>
  </g>
  <!-- 海雪微粒 -->
  <circle cx="14" cy="40" r="1.1" fill="#9fd8ec" opacity="0.5"/>
  <circle cx="48" cy="30" r="1.3" fill="#9fd8ec" opacity="0.6"/>
  <circle cx="20" cy="52" r="0.9" fill="#9fd8ec" opacity="0.4"/>
  <circle cx="44" cy="50" r="1" fill="#9fd8ec" opacity="0.35"/>
  <circle cx="52" cy="42" r="0.8" fill="#3ec8e8" opacity="0.7"/>
</svg>
